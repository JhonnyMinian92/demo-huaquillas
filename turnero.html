<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnero - Aguas Huaquillas</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gradient-to-br from-sky-900 to-sky-700 h-screen font-sans flex flex-col items-center justify-center relative overflow-hidden">
    <div id="ticketBanner" class="absolute top-0 left-0 w-full bg-emerald-500 text-white text-center py-6 text-3xl font-bold shadow-xl transform -translate-y-full transition-transform duration-500 ease-in-out z-50 flex items-center justify-center gap-4"><span>🖨️</span> Imprimiendo su ticket... Por favor, retírelo en la ranura inferior.</div>

    <div class="text-center mb-12">
      <h1 class="text-5xl font-black text-white mb-4 drop-shadow-lg">💧 AGUAS HUAQUILLAS EP</h1>
      <p class="text-2xl text-sky-200">Bienvenido. Toque la pantalla para generar su turno.</p>
    </div>

    <div class="grid grid-cols-2 gap-8 w-full max-w-5xl px-8">
      <button onclick="mostrarTicket()" class="bg-white hover:bg-sky-50 text-sky-900 rounded-3xl p-10 shadow-2xl transform transition active:scale-95 flex flex-col items-center gap-6 border-b-8 border-sky-300">
        <span class="text-7xl">💵</span>
        <span class="text-3xl font-bold">Pago de Planillas<br /><span class="text-xl text-slate-500 font-normal">(Recaudación)</span></span>
      </button>

      <button onclick="mostrarTicket()" class="bg-white hover:bg-sky-50 text-sky-900 rounded-3xl p-10 shadow-2xl transform transition active:scale-95 flex flex-col items-center gap-6 border-b-8 border-sky-300">
        <span class="text-7xl">🎧</span>
        <span class="text-3xl font-bold">Atención al Cliente<br /><span class="text-xl text-slate-500 font-normal">(Quejas y Convenios)</span></span>
      </button>

      <button onclick="mostrarTicket()" class="bg-white hover:bg-sky-50 text-sky-900 rounded-3xl p-10 shadow-2xl transform transition active:scale-95 flex flex-col items-center gap-6 border-b-8 border-sky-300">
        <span class="text-7xl">📝</span>
        <span class="text-3xl font-bold">Nuevos Contratos<br /><span class="text-xl text-slate-500 font-normal">(Comercialización)</span></span>
      </button>

      <button onclick="mostrarTicket()" class="bg-white hover:bg-sky-50 text-sky-900 rounded-3xl p-10 shadow-2xl transform transition active:scale-95 flex flex-col items-center gap-6 border-b-8 border-sky-300">
        <span class="text-7xl">🔧</span>
        <span class="text-3xl font-bold">Reporte de Daños<br /><span class="text-xl text-slate-500 font-normal">(Mantenimiento)</span></span>
      </button>
    </div>

    <script>
      function mostrarTicket() {
        const banner = document.getElementById('ticketBanner');
        banner.classList.remove('-translate-y-full'); // Baja el banner

        // Lo oculta automáticamente después de 3.5 segundos
        setTimeout(() => {
          banner.classList.add('-translate-y-full');
        }, 3500);
      }
    </script>
  </body>
</html>
