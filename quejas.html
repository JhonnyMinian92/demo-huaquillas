<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gestión de Quejas y Requerimientos</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .kanban-col { min-width: 320px; max-width: 360px; }
      .ticket-card.dragging { opacity: 0.5; transform: scale(0.95); }
      .drawer { transition: transform 0.3s ease-in-out; }
    </style>
  </head>

  <body class="bg-slate-50 h-screen overflow-hidden font-sans flex flex-col">
    <!-- HEADER -->
    <header class="bg-gradient-to-r from-blue-900 to-blue-800 shadow-md p-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="text-3xl">💧</div>

        <div>
          <h1 class="text-lg font-bold text-white">AGUAS HUAQUILLAS</h1>

          <p class="text-xs text-blue-100">Sistema de Recaudación</p>
        </div>
      </div>

      <div class="text-right">
        <p class="text-sm font-semibold text-white">
          Johanna Díaz:
          <span id="nombreCajera"> Cajera 01 </span>
        </p>

        <p class="text-xs text-blue-100">
          Sesión Abierta -
          <span id="horaActual">--:--</span>
        </p>
      </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 flex overflow-hidden">
      <!-- SIDEBAR -->
      <aside class="w-[34%] bg-white border-r border-slate-200 flex flex-col">
        <!-- BUSCADOR -->
        <div class="p-4 border-b bg-slate-50">
          <div class="relative">
            <input type="text" id="buscador" placeholder="Buscar ticket, cliente o cédula..." class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-700" />

            <span class="absolute left-3 top-3.5 text-slate-400"> 🔍 </span>
          </div>
        </div>

        <!-- FILTROS -->
        <div class="p-3 flex gap-2 border-b bg-white">
          <button id="btnActivos" onclick="cambiarVista('activos')" class="flex-1 py-2 rounded-lg bg-blue-700 text-white text-sm font-bold">Activos</button>

          <button id="btnCerrados" onclick="cambiarVista('cerrados')" class="flex-1 py-2 rounded-lg bg-slate-200 text-slate-700 text-sm font-bold">Cerrados</button>
        </div>

        <!-- LISTA -->
        <div id="listaTickets" class="flex-1 overflow-y-auto"></div>
      </aside>

      <!-- DETALLE -->
      <section class="flex-1 overflow-y-auto p-6">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <!-- HEADER TICKET -->
          <div class="p-6 border-b border-slate-200">
            <div class="flex justify-between items-start gap-4 flex-wrap">
              <div>
                <div class="flex items-center gap-3 mb-2">
                  <h2 id="tituloTicket" class="text-2xl font-bold text-slate-800">Facturación Excesiva</h2>

                  <span id="estadoTicket" class="px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700"> EN ANÁLISIS </span>
                </div>

                <p id="clienteTicket" class="text-slate-600">Cliente: Ana Mendoza</p>

                <p id="detalleTicket" class="text-sm text-slate-500 mt-1">Ticket #TK-2026-089 | Predio PRE-1045</p>
              </div>

              <!-- DERIVAR -->
              <div class="flex gap-2 flex-wrap">
                <select id="selectDerivar" class="px-4 py-2 rounded-lg border border-slate-300 bg-white text-sm font-semibold">
                  <option value="">Derivar a...</option>
                  <option>Mantenimiento</option>
                  <option>Jurídico</option>
                  <option>Catastro</option>
                  <option>Comercial</option>
                  <option>Gerencia</option>
                </select>

                <button onclick="derivarTicket()" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white rounded-lg font-semibold">Derivar</button>

                <button id="btnReabrir" onclick="reabrirTicket()" class="hidden px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-lg font-semibold">Reabrir Ticket</button>
              </div>
            </div>
          </div>

          <!-- BODY -->
          <div class="p-6">
            <!-- DESCRIPCION -->
            <div class="mb-6">
              <h3 class="font-bold text-slate-700 mb-3">Descripción del ciudadano</h3>

              <div id="descripcionTicket" class="bg-slate-100 p-5 rounded-xl text-slate-700 leading-relaxed"></div>
            </div>

            <!-- HISTORIAL -->
            <div class="mb-6">
              <h3 class="font-bold text-slate-700 mb-3">Historial del Ticket</h3>

              <div id="historialContainer" class="space-y-3"></div>
            </div>

            <!-- RESPUESTA -->
            <div id="contenedorRespuesta">
              <label class="block font-bold text-slate-700 mb-2"> Respuesta / Observaciones </label>

              <textarea id="respuesta" rows="5" class="w-full border border-slate-300 rounded-xl p-4 focus:ring-2 focus:ring-blue-700 focus:outline-none" placeholder="Ingrese la respuesta o detalle de atención..."></textarea>

              <div class="flex justify-end mt-4">
                <button onclick="cerrarTicket()" class="px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold shadow">Cerrar Ticket</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const tickets = [
        {
          id: 'TK-2026-089',
          titulo: 'Facturación Excesiva',
          cliente: 'Ana Mendoza',
          cedula: '0709876543',
          predio: 'PRE-1045',
          estado: 'EN PROCESO',
          tipo: 'Queja',
          cerrado: false,
          descripcion: 'Mi factura llegó por $85 cuando normalmente pago $12. Solicito revisión del medidor.',

          historial: [
            {
              fecha: '09/05/2026 08:20',
              detalle: 'Ticket creado por atención al cliente.',
            },
          ],
        },

        {
          id: 'TK-2026-090',
          titulo: 'Tubería rota en vía principal',
          cliente: 'Reporte Anónimo',
          cedula: '',
          predio: 'SIN PREDIO',
          estado: 'PENDIENTE',
          tipo: 'Daño',
          cerrado: false,
          descripcion: 'Existe una fuga de agua grande frente al parque central.',

          historial: [
            {
              fecha: '09/05/2026 10:10',
              detalle: 'Reporte generado desde ventanilla.',
            },
          ],
        },

        {
          id: 'TK-2026-050',
          titulo: 'Revisión de consumo',
          cliente: 'Carlos Paredes',
          cedula: '0705566778',
          predio: 'PRE-2020',
          estado: 'CERRADO',
          tipo: 'Queja',
          cerrado: true,
          descripcion: 'Cliente solicita revisión de valores altos.',

          historial: [
            {
              fecha: '05/05/2026 09:00',
              detalle: 'Ticket ingresado.',
            },

            {
              fecha: '06/05/2026 14:20',
              detalle: 'Derivado a mantenimiento.',
            },

            {
              fecha: '07/05/2026 16:40',
              detalle: 'Ticket cerrado con respuesta favorable.',
            },
          ],
        },
      ];

      let vistaActual = 'activos';

      let ticketActual = null;

      const lista = document.getElementById('listaTickets');

      // HORA
      function actualizarHora() {
        const now = new Date();

        document.getElementById('horaActual').innerText = now.toLocaleTimeString();
      }

      setInterval(actualizarHora, 1000);

      actualizarHora();

      // CAMBIAR VISTA
      function cambiarVista(vista) {
        vistaActual = vista;

        if (vista === 'activos') {
          btnActivos.className = 'flex-1 py-2 rounded-lg bg-blue-700 text-white text-sm font-bold';

          btnCerrados.className = 'flex-1 py-2 rounded-lg bg-slate-200 text-slate-700 text-sm font-bold';
        } else {
          btnCerrados.className = 'flex-1 py-2 rounded-lg bg-blue-700 text-white text-sm font-bold';

          btnActivos.className = 'flex-1 py-2 rounded-lg bg-slate-200 text-slate-700 text-sm font-bold';
        }

        renderTickets(document.getElementById('buscador').value);
      }

      // RENDER
      function renderTickets(filtro = '') {
        lista.innerHTML = '';

        const ticketsFiltrados = tickets.filter((ticket) => {
          const coincideBusqueda = (ticket.id + ticket.titulo + ticket.cliente + ticket.cedula).toLowerCase().includes(filtro.toLowerCase());

          const coincideVista = vistaActual === 'activos' ? !ticket.cerrado : ticket.cerrado;

          return coincideBusqueda && coincideVista;
        });

        if (ticketsFiltrados.length === 0) {
          lista.innerHTML = `
          <div class="p-8 text-center text-slate-400">
            No existen tickets
          </div>
        `;

          return;
        }

        ticketsFiltrados.forEach((ticket) => {
          const div = document.createElement('div');

          div.className = `
          p-4 border-b cursor-pointer transition
          hover:bg-slate-50
          ${ticketActual && ticket.id === ticketActual.id ? 'bg-blue-50 border-l-4 border-l-blue-700' : ''}
        `;

          div.innerHTML = `

          <div class="flex justify-between items-start mb-2">

            <span class="text-xs font-bold px-2 py-1 rounded bg-slate-100 text-slate-700">
              ${ticket.tipo}
            </span>

            <span class="
              text-xs
              font-bold
              ${ticket.cerrado ? 'text-slate-500' : 'text-amber-600'}
            ">
              ${ticket.estado}
            </span>

          </div>

          <h3 class="font-bold text-slate-800">
            ${ticket.titulo}
          </h3>

          <p class="text-sm text-slate-600 mt-1">
            ${ticket.cliente}
          </p>

          <p class="text-xs text-slate-400 mt-1">
            ${ticket.id}
          </p>

        `;

          div.onclick = () => seleccionarTicket(ticket);

          lista.appendChild(div);
        });
      }

      // SELECCIONAR
      function seleccionarTicket(ticket) {
        ticketActual = ticket;

        document.getElementById('tituloTicket').innerText = ticket.titulo;

        document.getElementById('clienteTicket').innerText = 'Cliente: ' + ticket.cliente;

        document.getElementById('detalleTicket').innerText = `${ticket.id} | ${ticket.predio}`;

        document.getElementById('descripcionTicket').innerText = ticket.descripcion;

        document.getElementById('estadoTicket').innerText = ticket.estado;

        document.getElementById('respuesta').value = '';

        // HISTORIAL
        const historial = document.getElementById('historialContainer');

        historial.innerHTML = '';

        ticket.historial.forEach((item) => {
          historial.innerHTML += `

          <div class="border border-slate-200 rounded-xl p-4 bg-slate-50">

            <div class="text-xs text-slate-400 mb-1">
              ${item.fecha}
            </div>

            <div class="text-sm text-slate-700">
              ${item.detalle}
            </div>

          </div>

        `;
        });

        // REABRIR
        if (ticket.cerrado) {
          document.getElementById('btnReabrir').classList.remove('hidden');

          document.getElementById('contenedorRespuesta').classList.add('hidden');
        } else {
          document.getElementById('btnReabrir').classList.add('hidden');

          document.getElementById('contenedorRespuesta').classList.remove('hidden');
        }

        document.getElementById('drawerOverlay').classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('ticketDrawer').classList.remove('translate-x-full');
      }

      function cerrarDrawer() {
        document.getElementById('drawerOverlay').classList.add('opacity-0', 'pointer-events-none');
        document.getElementById('ticketDrawer').classList.add('translate-x-full');
      }

      // DERIVAR
      function derivarTicket() {
        if (!ticketActual) return;

        const area = document.getElementById('selectDerivar').value;

        if (!area) {
          alert('Seleccione un departamento.');
          return;
        }

        ticketActual.historial.push({
          fecha: new Date().toLocaleString(),

          detalle: 'Ticket derivado a ' + area,
        });

        alert(`Ticket derivado a ${area}`);

        seleccionarTicket(ticketActual);
      }

      // CERRAR
      function cerrarTicket() {
        if (!ticketActual) return;

        const respuesta = document.getElementById('respuesta').value.trim();

        if (!respuesta) {
          alert('Debe ingresar una respuesta.');
          return;
        }

        ticketActual.cerrado = true;

        ticketActual.estado = 'CERRADO';

        ticketActual.historial.push({
          fecha: new Date().toLocaleString(),

          detalle: 'Ticket cerrado. Respuesta: ' + respuesta,
        });

        alert('Ticket cerrado correctamente.');

        cambiarVista('cerrados');

        seleccionarTicket(ticketActual);
      }

      // REABRIR
      function reabrirTicket() {
        if (!ticketActual) return;

        ticketActual.cerrado = false;

        ticketActual.estado = 'REABIERTO';

        ticketActual.historial.push({
          fecha: new Date().toLocaleString(),

          detalle: 'Ticket reabierto para nueva revisión.',
        });

        alert('Ticket reabierto.');

        cambiarVista('activos');

        seleccionarTicket(ticketActual);
      }

      // INICIAL
      renderTickets();

      seleccionarTicket(tickets[0]);
    </script>
  </body>
</html>
