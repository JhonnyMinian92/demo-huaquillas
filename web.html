<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Ciudadano - Aguas Huaquillas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-white font-sans flex flex-col items-center">
    <section class="w-full bg-gradient-to-br from-blue-900 to-blue-700 text-white py-20 px-6 text-center">
      <h1 class="text-4xl font-black mb-4">CONSULTA TU PLANILLA EN LÍNEA</h1>
      <p class="text-xl text-blue-100 max-w-2xl mx-auto">Ingresa tu identificación para conocer tus valores a pagar y fechas de corte.</p>

      <div class="max-w-lg mx-auto mt-10 bg-white p-2 rounded-2xl shadow-2xl flex items-center relative z-10">
        <input type="text" id="inputIdentificacion" onkeypress="if (event.key === 'Enter') consultarPlanilla();" placeholder="Cédula o RUC del abonado" class="flex-1 p-4 text-slate-800 outline-none rounded-l-2xl text-lg" />
        <button onclick="consultarPlanilla()" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-8 py-4 rounded-xl font-black transition-all">CONSULTAR</button>
      </div>

      <!-- Contenedor dinámico de resultados -->
      <div id="resultadoConsulta" class="max-w-lg mx-auto mt-4 w-full transition-all hidden z-0"></div>
    </section>

    <main class="max-w-5xl mx-auto py-16 grid grid-cols-1 md:grid-cols-3 gap-8 px-6">
      <button onclick="simularAccion('Pasarela de Pago Seguro')" class="block w-full bg-slate-50 p-8 rounded-3xl border border-slate-100 text-center hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer outline-none focus:ring-4 focus:ring-blue-100">
        <div class="text-4xl mb-4">💳</div>
        <h3 class="font-bold text-xl mb-2">Pago con Tarjeta</h3>
        <p class="text-slate-500 text-sm">Paga de forma segura sin salir de casa.</p>
      </button>
      <button onclick="simularAccion('Portal de Emisión de Especies y Solicitudes')" class="block w-full bg-slate-50 p-8 rounded-3xl border border-slate-100 text-center hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer outline-none focus:ring-4 focus:ring-blue-100">
        <div class="text-4xl mb-4">📄</div>
        <h3 class="font-bold text-xl mb-2">Comprar Especie</h3>
        <p class="text-slate-500 text-sm">Genera tu documento digital para trámites.</p>
      </button>
      <button onclick="simularAccion('Formulario de Quejas y Reclamos')" class="block w-full bg-slate-50 p-8 rounded-3xl border border-slate-100 text-center hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer outline-none focus:ring-4 focus:ring-blue-100">
        <div class="text-4xl mb-4">📢</div>
        <h3 class="font-bold text-xl mb-2">Quejas y Reclamos</h3>
        <p class="text-slate-500 text-sm">Reporta daños o inconformidades en línea.</p>
      </button>
    </main>

    <!-- Componente Toast de notificaciones -->
    <div id="toastWeb" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full text-sm font-bold opacity-0 translate-y-full transition-all duration-300 z-50 shadow-xl whitespace-nowrap pointer-events-none"></div>

    <script>
      // Base de datos simulada
      const baseAbonados = {
        '0706323193': { nombre: 'JUAN PÉREZ MENDOZA', deuda: 18.5, fechaCorte: '15/06/2026', estado: 'Vencido' },
        '0791784556001': { nombre: 'COMERCIAL LOS ANDES S.A.', deuda: 67.2, fechaCorte: '20/06/2026', estado: 'Por Vencer' },
        '0702381199': { nombre: 'ROSA CÓRDOVA PINEDA', deuda: 0.0, fechaCorte: '-', estado: 'Al día' },
      };

      function consultarPlanilla() {
        const input = document.getElementById('inputIdentificacion').value.trim();
        const resultado = document.getElementById('resultadoConsulta');

        if (!input) {
          mostrarToast('Por favor, ingrese un número de cédula o RUC.');
          return;
        }

        const datos = baseAbonados[input];
        resultado.classList.remove('hidden');

        if (datos) {
          if (datos.deuda > 0) {
            resultado.innerHTML = `
              <div class="bg-white p-6 rounded-2xl shadow-xl text-left border border-slate-200 animate-fade-in">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
                  <h3 class="font-black text-slate-800 text-lg">Detalle de Valores Pendientes</h3>
                  <span class="px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full uppercase tracking-wider">${datos.estado}</span>
                </div>
                <div class="space-y-3 text-sm">
                  <p class="text-slate-600">Abonado/Razón Social: <br><span class="font-bold text-slate-800 text-base">${datos.nombre}</span></p>
                  <div class="flex justify-between items-end">
                    <p class="text-slate-600">Total a pagar: <br><span class="text-3xl font-black text-blue-700">$${datos.deuda.toFixed(2)}</span></p>
                    <p class="text-slate-600 text-right">Fecha máxima: <br><span class="font-bold text-slate-800">${datos.fechaCorte}</span></p>
                  </div>
                </div>
                <button onclick="simularAccion('Pasarela de Pago Seguro')" class="w-full mt-5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-4 rounded-xl transition-all shadow-md text-sm tracking-wide uppercase">Pagar Planilla Ahora</button>
              </div>
            `;
          } else {
            resultado.innerHTML = `
              <div class="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl shadow-xl text-left animate-fade-in">
                <div class="flex items-center gap-3 mb-2">
                  <span class="text-3xl">✅</span>
                  <h3 class="font-black text-emerald-900 text-xl">¡Abonado al día!</h3>
                </div>
                <p class="text-emerald-800 text-sm mt-2">Estimado/a <strong>${datos.nombre}</strong>, usted no registra valores pendientes de pago en nuestra base de datos institucional en este momento.</p>
              </div>
            `;
          }
        } else {
          resultado.innerHTML = `
            <div class="bg-rose-50 border border-rose-200 p-6 rounded-2xl shadow-xl text-left animate-fade-in">
              <div class="flex items-center gap-3 mb-2">
                <span class="text-3xl">❌</span>
                <h3 class="font-black text-rose-900 text-xl">Sin Resultados</h3>
              </div>
              <p class="text-rose-800 text-sm mt-2">No hemos encontrado registros asociados a la identificación <strong>${input}</strong>. Por favor, verifique el número e intente nuevamente.</p>
            </div>
          `;
        }
      }

      function simularAccion(modulo) {
        mostrarToast('Redirigiendo al portal: ' + modulo + '...');
      }

      function mostrarToast(mensaje) {
        const toast = document.getElementById('toastWeb');
        toast.textContent = mensaje;
        toast.classList.remove('translate-y-full', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-full', 'opacity-0'), 3000);
      }
    </script>
  </body>
</html>
